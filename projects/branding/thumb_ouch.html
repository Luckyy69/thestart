<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;background:#000}
#t{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:"Inter Display","Inter";font-weight:900}
#bg{position:absolute;left:0;top:330px;width:1080px;height:1920px;object-fit:cover;filter:saturate(1.25) contrast(1.08)}
.vig{position:absolute;inset:0;background:linear-gradient(#0b0610f0 0%,#0b061000 26%,#0b061000 62%,#0b0610e6 82%)}
.o{position:absolute;left:0;right:0;text-align:center;letter-spacing:-4px;-webkit-text-stroke:0;paint-order:stroke fill}
.big{top:80px;font-size:150px;line-height:.9;color:#fff;text-shadow:0 0 0 #000,0 10px 0 #1d1424}
.sub{top:390px;font-size:80px !important;font-size:96px;color:#ffd24a}
.o span{-webkit-text-stroke:26px #1d1424;paint-order:stroke fill}
#tag{position:absolute;left:40px;right:40px;top:1560px;text-align:center;font-size:92px;color:#b8ff5a;-webkit-text-stroke:24px #1d1424;paint-order:stroke fill;letter-spacing:-3px}
#board{position:absolute;left:150px;right:150px;top:1390px;height:420px;background:#22302b;border:14px solid #1d1424;border-radius:28px;box-shadow:0 0 60px #ffd24a88,inset 0 0 0 8px #3b5248}
.row{display:flex;justify-content:space-between;align-items:center;padding:0 60px;height:200px;color:#f3ead2;font-size:130px;letter-spacing:-2px}
.row b{display:inline-block;width:150px;text-align:center;background:#111a17;border-radius:16px;color:#fff;font-size:150px;line-height:170px}
.row.top{border-bottom:8px solid #3b5248}
.brand{position:absolute;left:40px;bottom:30px;color:#fff;font-size:40px;-webkit-text-stroke:10px #1d1424;paint-order:stroke fill}
</style></head><body>
<div id="t"><img id="bg" src="ouch_1565.jpg"><div class="vig"></div>
<div class="o big"><span>WHY WE<br>SAY &quot;OW!&quot;</span></div>
<div class="o sub"><span>IT ACTUALLY WORKS 🤕</span></div>
<div id="tag">BUT THIS WORKS EVEN BETTER…</div>
<div class="brand">BEAN STORIES</div></div>
<script>document.querySelector('#bg').decode().then(()=>document.fonts.ready).then(()=>document.title='done')</script>
</body></html>
