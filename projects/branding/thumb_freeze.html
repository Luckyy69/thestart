<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;background:#000}
#t{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:"Inter Display","Inter";font-weight:900}
#bg{position:absolute;top:40px;width:1160px;height:2062px;left:-40px;object-fit:cover;filter:saturate(1.15) contrast(1.05)}
.top{position:absolute;inset:0;background:linear-gradient(#0d0a12 0%,#0d0a12e0 14%,#0d0a1200 32%,#0d0a1200 80%,#0d0a12c0 100%)}

.brand{position:absolute;left:40px;bottom:36px;color:#fff;font-size:40px;-webkit-text-stroke:10px #1d1424;paint-order:stroke fill}

<div id="t"><img id="bg" src="freezeT782.jpg"><div class="top"></div>
<div class="h"><span>BRAIN<br>FREEZE IS<br>A <b>LIE</b></span></div>

</body></html>
